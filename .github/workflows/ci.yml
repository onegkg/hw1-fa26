# CI Workflow for HW1 - NLP Pipeline Automation
#
# This workflow runs only when you start it by hand: on GitHub, open the Actions
# tab, choose "CI", and click "Run workflow". Students must fix all issues to make
# CI pass.
#
# In most projects, CI runs automatically on every push and pull request, with a
# trigger like this instead of `workflow_dispatch`:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#
# We don't do that here because your repository is private: GitHub Actions minutes
# for private repositories come out of your personal account's free monthly
# quota, which other courses may need too. Run the checks in your container
# first, and use CI to confirm.
#
# Every job runs inside the same Docker image you develop in (see
# .devcontainer/), with all tools and Python packages preinstalled, so a command
# that passes in your container should pass here, and on Gradescope, too.
#
# Jobs:
# 1. quality - Linting (ruff) and type checking (mypy)
# 2. shell - Shell script linting (shellcheck)
# 3. tests - Unit tests (pytest)
# 4. pipeline - Full pipeline execution with fixtures

name: CI

on:
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality (lint + typecheck)
    runs-on: ubuntu-latest
    container: ghcr.io/brandeis-cosi-106b/hw1-fa26:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run linter (ruff)
        run: ruff check src/

      - name: Run type checker (mypy)
        run: mypy

  shell:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    container: ghcr.io/brandeis-cosi-106b/hw1-fa26:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck --severity=warning scripts/*.sh

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container: ghcr.io/brandeis-cosi-106b/hw1-fa26:latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: pytest tests/ -v

  pipeline:
    name: Pipeline Integration
    runs-on: ubuntu-latest
    container: ghcr.io/brandeis-cosi-106b/hw1-fa26:latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Run full pipeline with fixtures
        run: make run-all DATA_DIR=tests/fixtures

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-artifacts
          path: build/
          retention-days: 7
